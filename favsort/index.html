<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 我的最愛拖曳排序元件：用 SortableJS（MIT 授權，檔案在同一個資料夾）。
     只在放開滑鼠／手指時把結果傳回 Streamlit；拖曳中不重畫、不改變高度，所以不會在交界處跳動。 -->
<script src="Sortable.min.js"></script>
<style>
  :root { --bg:#ffffff; --fg:#1f2329; --sub:#80868f; --line:rgba(128,128,128,.28); --box:rgba(128,128,128,.07);
          --accent:#2f5bd3; --hover:#eef3ff; --ghost:#dbe6ff; }
  body.dark { --bg:#1c1f26; --fg:#e7e9ee; --sub:#9aa0aa; --line:rgba(160,160,160,.28); --box:rgba(160,160,160,.08);
              --hover:#262c3a; --ghost:#2b3a63; }
  html, body { margin:0; padding:0; background:transparent; font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif; }
  .grp { background:var(--box); border:1px solid var(--line); border-radius:10px; margin:0 0 10px; padding:6px; }
  .hdr { font-weight:700; color:var(--accent); padding:4px 6px 6px; font-size:14px; }
  .hdr span { color:var(--sub); font-weight:400; font-size:12px; margin-left:4px; }
  ul { list-style:none; margin:0; padding:0; min-height:44px; border-radius:8px; }
  ul:empty { border:1px dashed var(--line); }
  ul:empty::before { content:"把股票拖到這裡"; display:block; color:var(--sub); font-size:12.5px; line-height:44px; text-align:center; }
  li { box-sizing:border-box; height:44px; display:flex; align-items:center; gap:10px; padding:0 8px 0 12px;
       background:var(--bg); color:var(--fg); border:1px solid var(--line); border-top-width:0;
       cursor:grab; user-select:none; -webkit-user-select:none; touch-action:pan-y; }
  li:first-child { border-top-width:1px; border-radius:8px 8px 0 0; }
  li:last-child { border-radius:0 0 8px 8px; }
  li:only-child { border-radius:8px; }
  li:hover { background:var(--hover); }
  li .code { font-weight:700; font-size:14px; min-width:3.6em; }
  li .name { color:var(--sub); font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .h { color:var(--sub); font-size:20px; line-height:44px; padding:0 4px; cursor:grab; }
  .ghost { background:var(--ghost) !important; opacity:.6; }
  .chosen { box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .sortable-fallback { opacity:.95 !important; box-shadow:0 6px 18px rgba(0,0,0,.22); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  const ROW = 44, HDR = 30, GAP = 10, PAD = 14;
  let last = "", sortables = [];

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  function result() {
    return [...document.querySelectorAll(".grp")].map(g => ({
      name: g.dataset.name,
      codes: [...g.querySelectorAll("li")].map(li => li.dataset.code)
    }));
  }
  function counts() {
    document.querySelectorAll(".grp").forEach(g => {
      g.querySelector(".hdr span").textContent = "（" + g.querySelectorAll("li").length + "）";
    });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function render(args, theme) {
    const key = JSON.stringify(args.groups);
    document.body.classList.toggle("dark", !!(theme && theme.base === "dark"));
    if (key === last) return;              // 內容沒變就不重畫（拖曳中 Streamlit 重跑也不會打斷）
    last = key;
    sortables.forEach(s => s.destroy()); sortables = [];
    const root = document.getElementById("root");
    root.innerHTML = args.groups.map(g =>
      `<div class="grp" data-name="${esc(g.name)}"><div class="hdr">📁 ${esc(g.name)}<span></span></div><ul>` +
      g.items.map(it => `<li data-code="${esc(it.code)}"><span class="code">${esc(it.code)}</span>` +
                         `<span class="name">${esc(it.name || "")}</span><span class="h">≡</span></li>`).join("") +
      `</ul></div>`).join("");
    counts();
    root.querySelectorAll("ul").forEach(ul => sortables.push(new Sortable(ul, {
      group: "favs", animation: 150, forceFallback: true, fallbackOnBody: true,
      swapThreshold: 0.65, emptyInsertThreshold: 24,
      delay: 150, delayOnTouchOnly: true, touchStartThreshold: 4,
      ghostClass: "ghost", chosenClass: "chosen",
      onEnd: function () { counts(); send("streamlit:setComponentValue", { value: { groups: result() }, dataType: "json" }); }
    })));
    // 高度一次算好：多留一列，股票移到別的群組時也不用改高度
    const total = args.groups.reduce((s, g) => s + HDR + PAD + Math.max(1, g.items.length) * ROW + GAP, 0) + ROW;
    send("streamlit:setFrameHeight", { height: total });
  }

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "streamlit:render") render(e.data.args || {}, e.data.theme);
  });
  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
